
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRECISION | 3D Aim Trainer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="hud">
    <div class="stat">TIME <strong id="timer">60</strong></div>
    <div class="stat">SCORE <strong id="score">0</strong></div>
    <div class="stat">HITS <strong id="hits">0</strong></div>
    <div class="stat">ACCURACY <strong id="accuracy">0%</strong></div>
  </div>

  <div id="crosshair"></div>
  <div id="hitmarker">HIT +100</div>

  <div id="menu">
    <h1 id="menuTitle">PRECISION</h1>
    <p>3D FIRST-PERSON AIM TRAINER</p>
    <div id="instructions">
      <p>Move your mouse to aim</p>
      <p>Left-click to shoot targets</p>
      <p>Hit as many as possible in 60 seconds</p>
      <p>Press ESC to pause</p>
    </div>
    <button id="startBtn">START TRAINING</button>
    <div id="result"></div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
